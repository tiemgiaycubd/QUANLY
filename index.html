        function compressImage(file, maxWidth = 1000, maxHeight = 1000, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; } } 
                        else { if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; } }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { resolve(new File([blob], file.name, { type: "image/jpeg", lastModified: Date.now() })); }, "image/jpeg", quality);
                    };
                };
            });
        }

        async function fetchAllPages(url) {

                const res = await fetch(nextUrl, { headers: { "Authorization": `Token ${GLOBAL_CONFIG.baserowToken}` } });
                if (!res.ok) throw new Error("Lỗi fetch dữ liệu");
                const data = await res.json(); results = results.concat(data.results); nextUrl = data.next;
            }
            return results;
        }

        async function fetchDataFromBaserow() {
            showToast("Đang đồng bộ dữ liệu...", "warning");
            try {
                const rawMua = await fetchAllPages(`https://api.baserow.io/api/database/rows/table/${GLOBAL_CONFIG.tableMua}/?user_field_names=true&size=200`);
                const rawGiat = await fetchAllPages(`https://api.baserow.io/api/database/rows/table/${GLOBAL_CONFIG.tableGiat}/?user_field_names=true&size=200`);

                const now = new Date();
                const threeDaysAgo = new Date(now.getTime() - (3 * 24 * 60 * 60 * 1000));

                const rowsToDelete = rawMua.filter(row => new Date(row["Thời gian"]) < threeDaysAgo);
                if (rowsToDelete.length > 0) {
                    showToast(`Tự động dọn dẹp ${rowsToDelete.length} đơn bán cũ...`, "warning");
                    for (const r of rowsToDelete) {
                        try { await fetch(`https://api.baserow.io/api/database/rows/table/${GLOBAL_CONFIG.tableMua}/${r.id}/`, { method: "DELETE", headers: { "Authorization": `Token ${GLOBAL_CONFIG.baserowToken}` } }); } catch(e) {}
                    }
                }

                dataStore.muaGiay = rawMua.filter(row => new Date(row["Thời gian"]) >= threeDaysAgo).map(row => ({
                    id: row.id, thoiGian: row["Thời gian"] || new Date().toISOString(), ten: row["Tên khách"] || "", sdt: row["Số điện thoại"] || "", tenGiay: row["Tên giày"] || "",
                    gia: Number(row["Giá bán"]) || 0, hinhThuc: row["Hình thức"]?.value || row["Hình thức"] || "", urlAnhGiay: row["Link ảnh giày"]?.[0]?.url || ""
                }));

                dataStore.giatGiay = rawGiat.map(row => ({
                    id: row.id, thoiGian: row["Thời gian"] || new Date().toISOString(), tenKhachHang: row["Tên khách hàng"] || "", sdt: row["Số điện thoại"] || "",
                    dichVu: row["Dịch vụ"] || "Giặt giày", chiPhi: 0, trangThaiThanhToan: row["Trạng thái thanh toán"]?.value || row["Trạng thái thanh toán"] || "Chưa thanh toán",
                    trangThai: row["Trạng thái xử lý"]?.value || row["Trạng thái xử lý"] || "Đang xử lý", urlAnhGiayGiat: row["Link ảnh giày giặt"]?.[0]?.url || ""
                }));

                renderHistoryList();
                showToast("Dữ liệu cập nhật thành công!", "success");
            } catch (error) { console.error(error); showToast("Đồng bộ thất bại.", "danger"); }
        }

        async function uploadToBaserow(file) {
            if (!file) return null; const formData = new FormData(); formData.append("file", file);
            const res = await fetch("https://api.baserow.io/api/user-files/upload-file/", { method: "POST", headers: { "Authorization": `Token ${GLOBAL_CONFIG.baserowToken}` }, body: formData });
            if (!res.ok) throw new Error("Lỗi tải ảnh"); return { name: (await res.json()).name }; 
        }

        async function sendTelegramNotification(text) {
            try { await fetch(`https://api.telegram.org/bot${GLOBAL_CONFIG.telegramToken}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: GLOBAL_CONFIG.telegramChat, text: text, parse_mode: 'HTML' }) }); } catch (e) {}
        }

        function switchTab(tabName) {
            ['mua-giay', 'giat-giay', 'tra-cuu', 'lich-su'].forEach(s => {
                const secEl = document.getElementById(`section-${s}`); const navEl = document.getElementById(`nav-${s}`);
                if (secEl) secEl.classList.add('hidden');
                if (navEl) navEl.className = "flex-1 min-w-0 w-0 flex flex-col sm:flex-row items-center justify-center space-y-1 sm:space-y-0 sm:space-x-1 py-2.5 px-0.5 rounded-xl text-[10px] sm:text-xs md:text-sm font-bold transition-all duration-200 bg-white text-slate-600 border border-slate-200 active:scale-95";
            });
            const targetSec = document.getElementById(`section-${tabName}`); const realTargetNav = document.getElementById(`nav-${tabName}`);
            if (targetSec) targetSec.classList.remove('hidden');
            if (realTargetNav) realTargetNav.className = "flex-1 min-w-0 w-0 flex flex-col sm:flex-row items-center justify-center space-y-1 sm:space-y-0 sm:space-x-1 py-2.5 px-0.5 rounded-xl text-[10px] sm:text-xs md:text-sm font-bold transition-all duration-200 bg-indigo-600 text-white shadow-lg shadow-indigo-100 active:scale-95";
            lucide.createIcons(); if (tabName === 'lich-su') renderHistoryList();
        }

        function addProductRow() {
            productRowCount++; const container = document.getElementById('product-rows-container'); const rowId = `prod-row-${productRowCount}`;
            const rowHtml = `<div id="${rowId}" class="bg-slate-50 border border-slate-200 p-3.5 rounded-xl space-y-2 relative"><button type="button" onclick="removeProductRow('${rowId}')" class="absolute top-2 right-2 text-slate-400 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button><div class="grid grid-cols-2 gap-2"><div><label class="block text-[10px] font-bold text-slate-500 mb-1">Tên & size giày *</label><input type="text" required class="prod-name w-full px-2 py-1.5 border border-slate-200 rounded-lg text-xs bg-white"></div><div><label class="block text-[10px] font-bold text-slate-500 mb-1">Giá bán (VND) *</label><input type="number" oninput="calculateTotalPayment()" onblur="handlePriceBlur(this)" required class="prod-price w-full px-2 py-1.5 border border-slate-200 rounded-lg text-xs bg-white"></div></div></div>`;
            container.insertAdjacentHTML('beforeend', rowHtml); lucide.createIcons(); calculateTotalPayment();
        }
        function removeProductRow(rowId) { if (document.getElementById('product-rows-container').children.length > 1) { document.getElementById(rowId).remove(); calculateTotalPayment(); } }
        function calculateTotalPayment() { let total = 0; document.querySelectorAll('.prod-price').forEach(input => { let val = parseInt(input.value) || 0; if (val > 0 && val < 10000) val *= 1000; total += val; }); document.getElementById('label-tong-thanh-toan').innerText = formatMoney(total); }
        function handlePriceBlur(input) { let val = parseInt(input.value) || 0; if (val > 0 && val < 10000) input.value = val * 1000; if (input.classList.contains('prod-price')) calculateTotalPayment(); }

        async function submitMuaGiay(e) {
            e.preventDefault(); const btnSubmit = document.getElementById('btn-submit-ban');
            const sdt = isAnonymousCustomer ? "Khách ẩn danh" : document.getElementById('mua-sdt').value.trim();
            const ten = isAnonymousCustomer ? "Khách ẩn danh" : document.getElementById('mua-ten').value.trim();
            const hinhThuc = document.querySelector('input[name="hinhthuc"]:checked').value;
            const fileBill = document.getElementById('mua-anh-bill').files[0]; const fileGiay = document.getElementById('mua-anh-giay-chung').files[0];
            if (!fileGiay) { showToast("Chưa chụp ảnh giày!", "danger"); return; }
            let items = []; let totalVal = 0;
            document.querySelectorAll('.prod-name').forEach((inp, i) => { let gia = parseInt(document.querySelectorAll('.prod-price')[i].value) || 0; if (gia > 0 && gia < 10000) gia *= 1000; totalVal += gia; items.push({ tenGiay: inp.value.trim(), gia }); });

            btnSubmit.disabled = true; btnSubmit.innerHTML = "Đang gửi lên Server...";
            try {
                const imgGiayObj = await uploadToBaserow(await compressImage(fileGiay));
                let imgBillObj = fileBill ? await uploadToBaserow(await compressImage(fileBill)) : null;
                
                for (let item of items) {
                    await fetch(`https://api.baserow.io/api/database/rows/table/${GLOBAL_CONFIG.tableMua}/?user_field_names=true`, {
                        method: "POST", headers: { "Authorization": `Token ${GLOBAL_CONFIG.baserowToken}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ "Thời gian": new Date().toISOString(), "Tên khách": ten, "Số điện thoại": sdt, "Tên giày": item.tenGiay, "Giá bán": item.gia, "Hình thức": hinhThuc, "Link ảnh Bill": imgBillObj ? [imgBillObj] : [], "Link ảnh giày": imgGiayObj ? [imgGiayObj] : [], "Tổng thanh toán đơn": totalVal })
                    });
                    
                    if (window.firebaseDb && window.firebaseAddDoc && window.firebaseCollection) {
                        try {
                            await window.firebaseAddDoc(window.firebaseCollection(window.firebaseDb, "doanhthu"), {
                                tenGiay: item.tenGiay, giaBan: Number(item.gia), giaVon: 0, thoiGian: new Date().toISOString()
                            });
                        } catch (fbErr) { console.error("Lỗi push Firebase:", fbErr); }
                    }
                }
                let msg = `<b>👟 ĐƠN BÁN MỚI!</b>\n👤 ${ten}\n💵 ${formatMoney(totalVal)}\n`; items.forEach(i => { msg += `- ${i.tenGiay}: ${formatMoney(i.gia)}\n`; }); await sendTelegramNotification(msg);
                showToast("Tạo đơn thành công!", "success"); await fetchDataFromBaserow();
                document.getElementById('form-mua-giay').reset(); setCustomerMode(false); document.getElementById('product-rows-container').innerHTML = ""; addProductRow();
                clearPreview('mua-anh-giay-chung', 'giay-chung-preview-box'); clearPreview('mua-anh-bill', 'bill-preview-box'); toggleBillUpload(false); switchTab('lich-su');
            } catch (err) { showToast("Lỗi: " + err.message, "danger"); } finally { btnSubmit.disabled = false; btnSubmit.innerHTML = `<i data-lucide="send" class="w-5 h-5"></i><span>Tạo Đơn Hàng</span>`; lucide.createIcons(); }
        }

        async function submitGiatGiay(e) {
            e.preventDefault(); const btnSubmit = document.getElementById('btn-submit-giat');
            const ten = document.getElementById('giat-ten').value.trim(); const sdt = document.getElementById('giat-sdt').value.trim();
            const trangThai = document.querySelector('input[name="trangthai_thanhtoan"]:checked').value;
            let tienCoc = 0; if (trangThai === "Cọc") { tienCoc = Number(document.getElementById('giat-tiencoc').value.trim()) || 0; if (tienCoc > 0 && tienCoc < 10000) tienCoc *= 1000; }
            const fileGiay = document.getElementById('giat-anh-giay').files[0]; if (!fileGiay) { showToast("Chưa chụp ảnh!", "danger"); return; }
            btnSubmit.disabled = true; btnSubmit.innerHTML = "Đang gửi...";
            try {
                const imgObj = await uploadToBaserow(await compressImage(fileGiay));
                await fetch(`https://api.baserow.io/api/database/rows/table/${GLOBAL_CONFIG.tableGiat}/?user_field_names=true`, {
                    method: "POST", headers: { "Authorization": `Token ${GLOBAL_CONFIG.baserowToken}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ "Thời gian": new Date().toISOString(), "Tên khách hàng": ten, "Số điện thoại": sdt, "Dịch vụ": trangThai === "Cọc" ? `Giặt (Cọc ${formatMoney(tienCoc)})` : "Giặt giày", "Chi phí": 0, "Trạng thái thanh toán": trangThai, "Trạng thái xử lý": "Đang xử lý", "Link ảnh giày giặt": imgObj ? [imgObj] : [] })
                });
                let teleMsg = `<b>🧼 ĐƠN GIẶT MỚI!</b>\n👤 ${ten}\n💵 T.Toán: ${trangThai}`; if (trangThai === "Cọc") teleMsg += ` (${formatMoney(tienCoc)})`; await sendTelegramNotification(teleMsg);
                showToast("Tạo đơn giặt thành công!", "success"); await fetchDataFromBaserow();
                document.getElementById('form-giat-giay').reset(); toggleDepositInput(false); clearPreview('giat-anh-giay', 'giat-giay-preview-box'); switchTab('lich-su');
            } catch (err) { showToast("Lỗi: " + err.message, "danger"); } finally { btnSubmit.disabled = false; btnSubmit.innerHTML = `<i data-lucide="plus-circle" class="w-5 h-5"></i><span>Tạo Đơn Giặt</span>`; lucide.createIcons(); }
        }

        function toggleDepositInput(show) { document.getElementById('deposit-amount-wrapper').classList.toggle('hidden', !show); document.getElementById('giat-tiencoc').required = show; lucide.createIcons(); }

        let currentHistFilter = 'tat-ca';
        function filterHistory(type) {
            currentHistFilter = type;
            ['tat-ca', 'mua', 'giat'].forEach(k => { document.getElementById(`btn-hist-${k}`).className = k === type ? "px-3 py-1.5 rounded-lg bg-white shadow-sm text-indigo-600" : "px-3 py-1.5 rounded-lg text-slate-600"; });
            renderHistoryList();
        }

        function copySdt(e, sdt) {
            if (e) e.stopPropagation();
            const el = document.createElement('textarea');
            el.value = sdt;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast('Đã copy SĐT: ' + sdt, 'success');
        }

        function renderHistoryList() {
            const listContainer = document.getElementById('history-list'); listContainer.innerHTML = ""; let list = [];
            if (currentHistFilter === 'tat-ca' || currentHistFilter === 'mua') { dataStore.muaGiay.forEach(m => list.push({ ...m, filterType: 'mua', sortDate: new Date(m.thoiGian) })); }
            if (currentHistFilter === 'tat-ca' || currentHistFilter === 'giat') { dataStore.giatGiay.forEach(g => list.push({ ...g, filterType: 'giat', sortDate: new Date(g.thoiGian) })); }
            list.sort((a, b) => b.sortDate - a.sortDate);
            if (list.length === 0) { listContainer.innerHTML = `<div class="text-center py-12 text-sm text-slate-400">Chưa có dữ liệu.</div>`; return; }

            list.forEach(item => {
                const row = document.createElement('div'); const imgUrl = item.filterType === 'mua' ? item.urlAnhGiay : item.urlAnhGiayGiat;
                row.className = "bg-white border border-slate-100 rounded-2xl p-4 shadow-sm";
                
                let phoneHtml = '';
                if (item.filterType === 'giat' && item.sdt) {
                    phoneHtml = `
                    <div class="mt-2 flex items-center space-x-1.5">
                        <span class="text-xs font-black text-slate-800 bg-slate-100 px-2 py-1 rounded-md border border-slate-200">${item.sdt}</span>
                        <button onclick="copySdt(event, '${item.sdt}')" class="p-1 bg-cyan-50 hover:bg-cyan-100 text-cyan-600 rounded-md transition" title="Copy SĐT"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                        <a href="tel:${item.sdt}" class="p-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-md transition" title="Gọi SĐT"><i data-lucide="phone-call" class="w-3.5 h-3.5"></i></a>
                    </div>`;
                }

                if (imgUrl) {
                    row.innerHTML = `<div class="grid grid-cols-2 gap-4"><div><span class="px-2 py-0.5 ${item.filterType==='mua'?'bg-indigo-50 text-indigo-700':'bg-cyan-50 text-cyan-700'} font-extrabold text-[9px] rounded-md uppercase">${item.filterType==='mua'?'Mua giày':'Dịch vụ giặt'}</span><div class="text-lg font-black ${item.filterType==='mua'?'text-indigo-600':'text-cyan-600'} pt-1">${item.filterType==='mua'?formatMoney(item.gia):''}</div><div class="text-xs font-bold text-slate-700 mt-1">${formatDate(item.thoiGian)}</div><h4 class="text-xs font-bold text-slate-900 mt-1.5 leading-tight">Khách: ${item.filterType==='mua'?item.ten:item.tenKhachHang}</h4>${phoneHtml}</div><div class="relative h-28 rounded-xl overflow-hidden border" onclick="openImageZoom('${imgUrl}')"><img src="${imgUrl}" class="w-full h-full object-cover"></div></div>`;
                } else {
                    row.innerHTML = `<div><span class="px-2 py-0.5 bg-slate-100 text-slate-700 font-extrabold text-[9px] rounded-md uppercase">${item.filterType==='mua'?'Mua giày':'Giặt giày'}</span><div class="text-lg font-black text-slate-900 mt-1">${item.filterType==='mua'?formatMoney(item.gia):''}</div><div class="text-xs text-slate-500">${formatDate(item.thoiGian)}</div><h4 class="text-xs font-bold text-slate-900 mt-1.5 leading-tight">Khách: ${item.filterType==='mua'?item.ten:item.tenKhachHang}</h4>${phoneHtml}</div>`;
                }
                listContainer.appendChild(row);
            });
            lucide.createIcons();
        }

        function toggleClearSearchBtn() { const si = document.getElementById('input-search'); const cb = document.getElementById('btn-clear-search'); if (si.value.trim().length > 0) cb.classList.remove('hidden'); else cb.classList.add('hidden'); }
        function clearSearch() { document.getElementById('input-search').value = ""; toggleClearSearchBtn(); executeSearch(); document.getElementById('input-search').focus(); }
        
        function executeSearch() {
            const q = document.getElementById('input-search').value.trim().toLowerCase(); const res = document.getElementById('search-results'); res.innerHTML = "";
            if (!q) { res.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Gõ SĐT hoặc từ khóa để tra cứu hồ sơ</div>`; return; }
            let sdtSet = new Set();
            dataStore.muaGiay.forEach(m => { if (m.sdt.includes(q) || m.ten.toLowerCase().includes(q) || m.tenGiay.toLowerCase().includes(q)) sdtSet.add(m.sdt); });
            dataStore.giatGiay.forEach(g => { if (g.sdt.includes(q) || g.tenKhachHang.toLowerCase().includes(q)) sdtSet.add(g.sdt); });
            if (sdtSet.size === 0) { res.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Không tìm thấy kết quả</div>`; return; }

            sdtSet.forEach(sdt => {
                let cm = dataStore.muaGiay.filter(m => m.sdt === sdt).map(m => ({ type: 'Mua', ...m, dateObj: new Date(m.thoiGian) }));
                let cg = dataStore.giatGiay.filter(g => g.sdt === sdt).map(g => ({ type: 'Giặt', ...g, dateObj: new Date(g.thoiGian) }));
                let name = cm.length > 0 ? cm[0].ten : (cg.length > 0 ? cg[0].tenKhachHang : "Khách");
                let all = [...cm, ...cg].sort((a, b) => b.dateObj - a.dateObj);
                
                res.innerHTML += `
                <div class="bg-white border border-slate-100 rounded-2xl p-4 mb-3 shadow-sm">
                    <div class="flex items-center justify-between mb-3 pb-3 border-b border-slate-100">
                        <h3 class="text-sm font-black text-slate-900 truncate pr-2">${name}</h3>
                        <div class="flex items-center space-x-1.5 shrink-0">
                            <span class="text-xs font-bold text-slate-800 bg-slate-100 px-2 py-1 rounded-md border border-slate-200">${sdt}</span>
                            <button onclick="copySdt(event, '${sdt}')" class="p-1 bg-cyan-50 hover:bg-cyan-100 text-cyan-600 rounded-md transition" title="Copy SĐT"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                            <a href="tel:${sdt}" class="p-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-md transition" title="Gọi SĐT"><i data-lucide="phone-call" class="w-3.5 h-3.5"></i></a>
                        </div>
                    </div>
                    <div class="space-y-3">
                        ${all.map(t => {
                            let imgUrl = t.type === 'Mua' ? t.urlAnhGiay : t.urlAnhGiayGiat;
                            let imgHtml = imgUrl ? `<div class="relative aspect-[4/3] w-28 shrink-0 rounded-xl overflow-hidden border border-slate-200 cursor-pointer" onclick="openImageZoom('${imgUrl}')"><img src="${imgUrl}" class="w-full h-full object-cover hover:scale-105 transition"></div>` : '';
                            
                            if(t.type === 'Mua') {
                                return `
                                <div class="flex items-stretch gap-3 bg-slate-50 p-2 border border-slate-200 rounded-xl">
                                    ${imgHtml}
                                    <div class="flex-1 flex flex-col justify-center py-1 overflow-hidden">
                                        <div><span class="text-indigo-600 font-extrabold bg-indigo-100 px-1.5 py-0.5 rounded-md text-[9px] uppercase tracking-wider">Mua giày</span></div>
                                        <div class="mt-1 font-bold text-slate-800 text-sm leading-tight truncate">${t.tenGiay}</div>
                                        <div class="font-black text-indigo-600 text-base mt-0.5">${formatMoney(t.gia)}</div>
                                        <div class="text-[10px] text-slate-400 mt-1">${formatDate(t.thoiGian)}</div>
                                    </div>
                                </div>`;
                            } else {
                                return `
                                <div class="flex items-stretch gap-3 bg-slate-50 p-2 border border-slate-200 rounded-xl">
                                    ${imgHtml}
                                    <div class="flex-1 flex flex-col justify-center py-1 overflow-hidden">
                                        <div><span class="text-cyan-600 font-extrabold bg-cyan-100 px-1.5 py-0.5 rounded-md text-[9px] uppercase tracking-wider">Giặt giày</span></div>
                                        <div class="mt-1 font-bold text-slate-800 text-sm leading-tight truncate">${t.dichVu || "Dịch vụ giặt"}</div>
                                        <div class="text-xs font-bold text-slate-600 mt-0.5">TT: ${t.trangThaiThanhToan}</div>
                                        <div class="text-[10px] text-slate-400 mt-1">${formatDate(t.thoiGian)}</div>
                                    </div>
                                </div>`;
                            }
                        }).join('')}
                    </div>
                </div>`;
            });
            lucide.createIcons();
        }

        function autoFillName(sId, nId) {
            const s = document.getElementById(sId).value.trim(); if (!s || s.length < 9) return; 
            let m = dataStore.giatGiay.find(g => g.sdt === s) || dataStore.muaGiay.find(x => x.sdt === s);
            if (m) document.getElementById(nId).value = m.tenKhachHang || m.ten;
        }

        function openImageZoom(src) { document.getElementById('fullscreen-image').src = src; document.getElementById('image-viewer-modal').classList.remove('hidden'); }
        function toggleImageViewer(show) { document.getElementById('image-viewer-modal').classList.toggle('hidden', !show); }
        function toggleBillUpload(show) { document.getElementById('bill-upload-wrapper').classList.toggle('hidden', !show); document.getElementById('mua-anh-bill').required = show; }
        function previewImage(input, pId) { const file = input.files[0]; if (file) { const reader = new FileReader(); reader.onload = (e) => { document.getElementById(pId).src = e.target.result; document.getElementById(pId + '-box').classList.remove('hidden'); }; reader.readAsDataURL(file); } }
        function clearPreview(iId, bId) { document.getElementById(iId).value = ""; document.getElementById(bId).classList.add('hidden'); }
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container'); const toast = document.createElement('div');
            let bgClass = type === 'danger' ? "bg-danger" : (type === 'warning' ? "bg-warning" : "bg-success");
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-semibold mb-2 pointer-events-auto transition`;
            toast.innerHTML = `<span>${msg}</span>`; container.appendChild(toast); setTimeout(() => toast.remove(), 3500);
        }
    </script>
</body>
</html>
