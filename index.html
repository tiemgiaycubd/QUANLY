<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

            <i data-lucide="shopping-bag" class="w-5 h-5 mb-1"></i>
            <span class="text-[10px] uppercase">Mua Giày</span>
        </button>
        <button onclick="switchTab('giat-giay')" id="tab-giat-giay" class="flex-1 min-w-[80px] flex flex-col items-center p-2 rounded-xl text-slate-500 hover:bg-slate-50 transition">
            <i data-lucide="waves" class="w-5 h-5 mb-1"></i>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 overflow-y-auto bg-slate-50 relative">
        
        <!-- SECTION 1: TẠO ĐƠN MUA GIÀY -->
        <section id="section-mua-giay" class="p-4 max-w-xl mx-auto block animate-in fade-in duration-200">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
                <div class="flex items-center space-x-2 mb-5 pb-3 border-b border-slate-100">

                <form id="form-mua" onsubmit="submitMuaGiay(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Tên Khách</label>

                    <div class="space-y-3 pt-2">

                        <label class="flex flex-col border border-slate-200 rounded-xl p-3 cursor-pointer hover:bg-slate-50 transition relative overflow-hidden group">
                            <span class="text-xs font-bold text-slate-700 mb-1 flex items-center space-x-1"><i data-lucide="receipt" class="w-4 h-4"></i><span>Tải Ảnh Bill (Nếu CK)</span></span>
                            <input type="file" id="mua-anhbill" accept="image/*" onchange="previewImage(this, 'mua-preview-bill')" class="text-[10px] text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-bold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">

                    <button type="submit" id="btn-submit-mua" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md shadow-indigo-200 flex items-center justify-center space-x-2 transition duration-300">

        <!-- SECTION 2: TẠO ĐƠN GIẶT GIÀY -->
        <section id="section-giat-giay" class="p-4 max-w-xl mx-auto hidden animate-in fade-in duration-200">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
                <div class="flex items-center space-x-2 mb-5 pb-3 border-b border-slate-100">
                    <i data-lucide="waves" class="w-5 h-5 text-cyan-600"></i>
                    <h2 class="text-base font-bold text-slate-900">Tạo Đơn Giặt Giày</h2>
                </div>
                <form id="form-giat" onsubmit="submitGiatGiay(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Tên Khách</label>
                            <input type="text" id="giat-ten" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 focus:bg-white transition">

                            <input type="tel" id="giat-sdt" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 focus:bg-white transition">

                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Dịch vụ yêu cầu</label>
                        <input type="text" id="giat-dichvu" required placeholder="Vd: Giặt hấp, tẩy ố..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 focus:bg-white transition">
                    </div>

                    <label class="flex flex-col border border-slate-200 rounded-xl p-3 cursor-pointer hover:bg-slate-50 transition relative overflow-hidden group">
                        <span class="text-xs font-bold text-slate-700 mb-1 flex items-center space-x-1"><i data-lucide="camera" class="w-4 h-4"></i><span>Chụp Ảnh Tình Trạng Giày</span></span>
                        <input type="file" id="giat-anhgiay" accept="image/*" onchange="previewImage(this, 'giat-preview-giay')" class="text-[10px] text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-[10px] file:font-bold file:bg-cyan-50 file:text-cyan-600 hover:file:bg-cyan-100">
                        <div id="giat-preview-giay" class="hidden mt-2 w-full aspect-[4/3] rounded-lg bg-cover bg-center border border-slate-200"></div>
                    </label>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Thanh Toán</label>
                            <select id="giat-thanhtoan" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-cyan-500 focus:bg-white font-semibold">
                                <option value="Chưa thanh toán">Chưa thanh toán</option>
                                <option value="Cọc">Đã cọc</option>
                                <option value="Đã thanh toán">Đã thanh toán</option>

                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Xử Lý</label>
                            <select id="giat-xuly" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-cyan-500 focus:bg-white font-semibold">
                                <option value="Đang xử lý">Đang xử lý</option>
                                <option value="Đã hoàn tất">Đã hoàn tất</option>
                            </select>
                        </div>

                    <button type="submit" id="btn-submit-giat" class="w-full py-3.5 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl font-bold shadow-md shadow-cyan-200 flex items-center justify-center space-x-2 transition duration-300">
                        <i data-lucide="check-circle" class="w-5 h-5"></i>

        <!-- SECTION 3: LỊCH SỬ -->
        <section id="section-lich-su" class="p-4 space-y-4 max-w-xl mx-auto hidden animate-in fade-in duration-200">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold text-slate-950 flex flex-col">
                    <span class="flex items-center space-x-2">
                        <i data-lucide="history" class="w-5 h-5 text-indigo-600"></i>
                        <span>Lịch Sử</span>
                    </span>
                    <span class="text-[10px] text-slate-400 font-medium ml-7">(Mua: 3 ngày gần nhất | Giặt: Tất cả)</span>
                </h2>
                
                <div class="flex space-x-1 bg-slate-200 p-1 rounded-xl text-xs font-semibold">
                    <button id="btn-hist-tat-ca" onclick="filterHistory('tat-ca')" class="px-3 py-1.5 rounded-lg bg-white shadow-sm text-indigo-600">Tất cả</button>
                    <button id="btn-hist-mua" onclick="filterHistory('mua')" class="px-3 py-1.5 rounded-lg text-slate-600">Mua</button>

            <div id="history-list" class="space-y-3 pb-8">

        <!-- SECTION 4: TRA CỨU -->
        <section id="section-tra-cuu" class="p-4 space-y-4 max-w-xl mx-auto hidden animate-in fade-in duration-200">

                <i data-lucide="search" class="w-5 h-5"></i>

            </div>
            
            <div class="relative">
                <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3.5 text-slate-400"></i>
                <input type="text" id="input-search" oninput="toggleClearSearchBtn()" onkeyup="if(event.key==='Enter') executeSearch()" placeholder="Nhập Số điện thoại hoặc Tên khách..." class="w-full pl-10 pr-10 py-3.5 bg-white border border-slate-200 rounded-xl text-sm font-semibold shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">

                    <i data-lucide="x-circle" class="w-5 h-5"></i>
                </button>
            </div>
            <button onclick="executeSearch()" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold transition flex items-center justify-center space-x-2">
                <i data-lucide="search" class="w-4 h-4"></i><span>Tìm Kiếm</span>
            </button>
            
            <div id="search-results" class="mt-4 space-y-3 pb-8">

    <!-- IMAGE LIGHTBOX -->
    <div id="lightbox-modal" class="fixed inset-0 bg-black/95 z-50 items-center justify-center p-4 hidden flex-col" onclick="closeImageZoom()">
        <img id="lightbox-image" src="" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain">
        <button class="absolute top-4 right-4 bg-white/20 text-white p-2.5 rounded-full hover:bg-white/40 transition">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- FIREBASE MODULE (Ngầm cho Lợi Nhuận) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWRBa3-QI8QG6kfP2J_qzgbpDz2_GJPp8",
            authDomain: "doanhthu-73ade.firebaseapp.com",
            projectId: "doanhthu-73ade",
            storageBucket: "doanhthu-73ade.firebasestorage.app",
            messagingSenderId: "449682329782",
            appId: "1:449682329782:web:94974d346a4b49f8651617"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.firebaseDb = db;
        window.fbAddDoc = addDoc;
        window.fbCollection = collection;
    </script>

    <!-- CORE LOGIC JAVASCRIPT -->
    <script>
        const DB_CONFIG = {
            token: 'NiWMS76P9sn2yP76BS53dgiikbc76utz',
            tableMua: '1012082',
            tableGiat: '1012088'
        };

        let dataStore = { muaGiay: [], giatGiay: [] };

        window.onload = function() {
            lucide.createIcons();
            fetchDataFromBaserow();
        };

        // Utility: Copy Text
        function copySdt(e, sdt) {
            if (e) e.stopPropagation();
            const el = document.createElement('textarea');
            el.value = sdt;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast('Đã copy SĐT: ' + sdt, 'success');
        }

        // Tự động x1000 cho giá
        function handlePriceBlur(input) {
            let val = parseInt(input.value) || 0;
            if (val > 0 && val < 10000) {
                input.value = val * 1000;
            }
        }

        // ⚡ Vá lỗi Failed to fetch & Tải nhiều trang
        async function fetchAllPages(url) {
            let results = []; 
            let nextUrl = url;
            while(nextUrl) {
                // Ép HTTPS
                if (nextUrl.startsWith('http://')) {
                    nextUrl = nextUrl.replace('http://', 'https://');
                }
                const res = await fetch(nextUrl, { headers: { "Authorization": `Token ${DB_CONFIG.token}` } });
                if (!res.ok) throw new Error("Lỗi fetch dữ liệu Baserow");
                const data = await res.json();
                results = results.concat(data.results);
                nextUrl = data.next;
            }
            return results;
        }

        // Lấy dữ liệu & TỰ DỌN RÁC SAU 3 NGÀY NGẦM
        async function fetchDataFromBaserow() {
            document.getElementById('global-loading').style.display = 'flex';
            try {
                // Tải full dữ liệu Giặt Giày
                const giatRes = await fetchAllPages(`https://api.baserow.io/api/database/rows/table/${DB_CONFIG.tableGiat}/?user_field_names=true`);
                
                // Tải full dữ liệu Mua Giày
                const muaRes = await fetchAllPages(`https://api.baserow.io/api/database/rows/table/${DB_CONFIG.tableMua}/?user_field_names=true`);

                // ⚡ AUTO-DELETE LÃO HÓA > 3 NGÀY CHO MUA GIÀY
                const now = new Date();
                const threeDaysAgo = new Date(now.getTime() - (3 * 24 * 60 * 60 * 1000));
                
                let activeMua = [];
                for (let row of muaRes) {
                    const rowDate = new Date(row["Thời gian"]);
                    if (rowDate < threeDaysAgo) {
                        // Gọi xóa ngầm không cần báo cáo
                        fetch(`https://api.baserow.io/api/database/rows/table/${DB_CONFIG.tableMua}/${row.id}/`, {
                            method: "DELETE",
                            headers: { "Authorization": `Token ${DB_CONFIG.token}` }
                        }).catch(e => console.log("Lỗi xóa ngầm:", e));
                    } else {
                        activeMua.push(row);
                    }
                }

                dataStore.giatGiay = giatRes.map(row => ({
                    id: row.id,
                    tenKhachHang: row["Tên khách hàng"] || "",
                    sdt: row["Số điện thoại"] || "",
                    dichVu: row["Dịch vụ"] || "",
                    trangThaiThanhToan: row["Trạng thái thanh toán"]?.value || row["Trạng thái thanh toán"] || "Chưa thanh toán",
                    trangThaiXuLy: row["Trạng thái xử lý"]?.value || row["Trạng thái xử lý"] || "Đang xử lý",
                    thoiGian: row["Thời gian"],
                    urlAnhGiayGiat: row["Link ảnh giày giặt"]?.[0]?.url || ""
                }));

                dataStore.muaGiay = activeMua.map(row => ({
                    id: row.id,
                    ten: row["Tên khách"] || "",
                    sdt: row["Số điện thoại"] || "",
                    tenGiay: row["Tên giày"] || "",
                    gia: Number(row["Giá bán"]) || 0,
                    hinhThuc: row["Hình thức"]?.value || row["Hình thức"] || "Tiền mặt",
                    thoiGian: row["Thời gian"],
                    urlAnhGiay: row["Link ảnh giày"]?.[0]?.url || "",
                    urlAnhBill: row["Link ảnh Bill"]?.[0]?.url || ""
                }));

                renderHistoryList();
                if(document.getElementById('input-search').value.trim() !== "") executeSearch();
                showToast("Đồng bộ máy chủ thành công!", "success");
            } catch (err) {
                console.error(err);
                showToast("Lỗi kết nối máy chủ", "danger");
            } finally {
                document.getElementById('global-loading').style.display = 'none';
            }
        }

        // TẠO ĐƠN MUA & BẮN SANG FIREBASE
        async function submitMuaGiay(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-mua');
            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i><span>Đang tải lên...</span>`;
            lucide.createIcons();

            let giaBanVal = Number(document.getElementById('mua-gia').value) || 0;
            if (giaBanVal > 0 && giaBanVal < 10000) giaBanVal = giaBanVal * 1000;

            const payload = {
                "Tên khách": document.getElementById('mua-ten').value.trim(),
                "Số điện thoại": document.getElementById('mua-sdt').value.trim(),
                "Tên giày": document.getElementById('mua-tengiay').value.trim(),
                "Giá bán": Number(giaBanVal),
                "Hình thức": document.getElementById('mua-hinhthuc').value,
                "Tổng thanh toán đơn": Number(giaBanVal),
                "Thời gian": new Date().toISOString()
            };

            const fileGiay = document.getElementById('mua-anhgiay').files[0];
            const fileBill = document.getElementById('mua-anhbill').files[0];

            try {
                if (fileGiay) {
                    const tokenGiay = await uploadFileToBaseRow(fileGiay);
                    if (tokenGiay) payload["Link ảnh giày"] = [{"name": tokenGiay}];
                }
                if (fileBill) {
                    const tokenBill = await uploadFileToBaseRow(fileBill);
                    if (tokenBill) payload["Link ảnh Bill"] = [{"name": tokenBill}];
                }

                // 1. Lưu Baserow
                const res = await fetch(`https://api.baserow.io/api/database/rows/table/${DB_CONFIG.tableMua}/?user_field_names=true`, {
                    method: 'POST',
                    headers: { 'Authorization': `Token ${DB_CONFIG.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error("Lỗi Baserow");

                // 2. Bắn Doanh Thu sang Firebase
                if (window.firebaseDb && window.fbAddDoc && window.fbCollection) {
                    await window.fbAddDoc(window.fbCollection(window.firebaseDb, "doanhthu"), {
                        tenGiay: payload["Tên giày"],
                        giaBan: payload["Giá bán"],
                        giaVon: 0,
                        thoiGian: payload["Thời gian"]
                    });
                }

                showToast("Chốt đơn thành công & Đã lưu doanh thu!", "success");
                document.getElementById('form-mua').reset();
                document.getElementById('mua-preview-giay').style.backgroundImage = "";
                document.getElementById('mua-preview-giay').classList.add('hidden');
                document.getElementById('mua-preview-bill').style.backgroundImage = "";
                document.getElementById('mua-preview-bill').classList.add('hidden');
                
                await fetchDataFromBaserow();
                switchTab('lich-su');
            } catch (err) {
                console.error(err);
                showToast("Lỗi: " + err.message, "danger");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnHtml;
                lucide.createIcons();
            }
        }

        // TẠO ĐƠN GIẶT
        async function submitGiatGiay(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-giat');
            const originalBtnHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i><span>Đang xử lý...</span>`;
            lucide.createIcons();

            const payload = {
                "Tên khách hàng": document.getElementById('giat-ten').value.trim(),
                "Số điện thoại": document.getElementById('giat-sdt').value.trim(),
                "Dịch vụ": document.getElementById('giat-dichvu').value.trim(),
                "Trạng thái thanh toán": document.getElementById('giat-thanhtoan').value,
                "Trạng thái xử lý": document.getElementById('giat-xuly').value,
                "Thời gian": new Date().toISOString()
            };

            const fileGiay = document.getElementById('giat-anhgiay').files[0];

            try {
                if (fileGiay) {
                    const tokenGiay = await uploadFileToBaseRow(fileGiay);
                    if (tokenGiay) payload["Link ảnh giày giặt"] = [{"name": tokenGiay}];
                }

                const res = await fetch(`https://api.baserow.io/api/database/rows/table/${DB_CONFIG.tableGiat}/?user_field_names=true`, {
                    method: 'POST',
                    headers: { 'Authorization': `Token ${DB_CONFIG.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("Lỗi lưu đơn giặt");

                showToast("Nhận đơn giặt giày thành công!", "success");
                document.getElementById('form-giat').reset();
                document.getElementById('giat-preview-giay').style.backgroundImage = "";
                document.getElementById('giat-preview-giay').classList.add('hidden');
                
                await fetchDataFromBaserow();
                switchTab('lich-su');
            } catch (err) {
                console.error(err);
                showToast("Lỗi: " + err.message, "danger");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalBtnHtml;
                lucide.createIcons();
            }
        }

        async function uploadFileToBaseRow(file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('https://api.baserow.io/api/user-files/upload-file/', {
                    method: 'POST',
                    headers: { 'Authorization': `Token ${DB_CONFIG.token}` },
                    body: formData
                });
                if (!res.ok) throw new Error("Upload ảnh thất bại");
                const data = await res.json();
                return data.name;
            } catch (err) {
                console.error(err);
                return null;
            }
        }

        // LỊCH SỬ THÔNG MINH
        let currentHistFilter = 'tat-ca';
        function filterHistory(type) {
            currentHistFilter = type;
            ['tat-ca', 'mua', 'giat'].forEach(k => { 
                document.getElementById(`btn-hist-${k}`).className = k === type ? "px-3 py-1.5 rounded-lg bg-white shadow-sm text-indigo-600" : "px-3 py-1.5 rounded-lg text-slate-600 hover:text-indigo-600 transition"; 
            });
            renderHistoryList();
        }

        function renderHistoryList() {
            const listContainer = document.getElementById('history-list'); 
            listContainer.innerHTML = ""; 
            let list = [];
            
            if (currentHistFilter === 'tat-ca' || currentHistFilter === 'mua') { 
                dataStore.muaGiay.forEach(m => list.push({ ...m, filterType: 'mua', sortDate: new Date(m.thoiGian) })); 
            }
            if (currentHistFilter === 'tat-ca' || currentHistFilter === 'giat') { 
                dataStore.giatGiay.forEach(g => list.push({ ...g, filterType: 'giat', sortDate: new Date(g.thoiGian) })); 
            }
            
            list.sort((a, b) => b.sortDate - a.sortDate);
            
            if (list.length === 0) { 
                listContainer.innerHTML = `<div class="text-center py-12 text-sm text-slate-400">Chưa có dữ liệu.</div>`; 
                return; 
            }

            list.forEach(item => {
                const row = document.createElement('div'); 
                const imgUrl = item.filterType === 'mua' ? item.urlAnhGiay : item.urlAnhGiayGiat;
                row.className = "bg-white border border-slate-100 rounded-2xl p-4 shadow-sm hover:shadow-md transition";
                
                let phoneHtml = '';
                if (item.filterType === 'giat' && item.sdt) {
                    phoneHtml = `
                    <div class="mt-2 flex items-center space-x-1.5">
                        <span class="text-xs font-black text-slate-800 bg-slate-100 px-2 py-1 rounded-md border border-slate-200">${item.sdt}</span>
                        <button onclick="copySdt(event, '${item.sdt}')" class="p-1.5 bg-cyan-50 hover:bg-cyan-100 text-cyan-600 rounded-md transition" title="Copy SĐT"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                        <a href="tel:${item.sdt}" class="p-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-md transition" title="Gọi SĐT"><i data-lucide="phone-call" class="w-3.5 h-3.5"></i></a>
                    </div>`;
                }

                if (imgUrl) {
                    row.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <span class="px-2 py-0.5 ${item.filterType==='mua'?'bg-indigo-50 text-indigo-700':'bg-cyan-50 text-cyan-700'} font-extrabold text-[9px] rounded-md uppercase">${item.filterType==='mua'?'Mua giày':'Dịch vụ giặt'}</span>
                            <div class="text-lg font-black ${item.filterType==='mua'?'text-indigo-600':'text-cyan-600'} pt-1">${item.filterType==='mua'?formatMoney(item.gia):''}</div>
                            <div class="text-[10px] text-slate-500 font-medium mt-1">${formatDate(item.thoiGian)}</div>
                            <h4 class="text-xs font-bold text-slate-900 mt-1.5 leading-tight">Khách: ${item.filterType==='mua'?item.ten:item.tenKhachHang}</h4>
                            ${phoneHtml}
                        </div>
                        <div class="relative aspect-[4/3] rounded-xl overflow-hidden border border-slate-200 cursor-pointer shadow-sm group" onclick="openImageZoom('${imgUrl}')">
                            <img src="${imgUrl}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        </div>
                    </div>`;
                } else {
                    row.innerHTML = `
                    <div>
                        <span class="px-2 py-0.5 ${item.filterType==='mua'?'bg-indigo-50 text-indigo-700':'bg-cyan-50 text-cyan-700'} font-extrabold text-[9px] rounded-md uppercase">${item.filterType==='mua'?'Mua giày':'Dịch vụ giặt'}</span>
                        <div class="text-lg font-black text-slate-900 mt-1">${item.filterType==='mua'?formatMoney(item.gia):''}</div>
                        <div class="text-[10px] text-slate-500 font-medium mt-1">${formatDate(item.thoiGian)}</div>
                        <h4 class="text-xs font-bold text-slate-900 mt-1.5 leading-tight">Khách: ${item.filterType==='mua'?item.ten:item.tenKhachHang}</h4>
                        ${phoneHtml}
                    </div>`;
                }
                listContainer.appendChild(row);
            });
            lucide.createIcons();
        }

        // TRA CỨU
        function toggleClearSearchBtn() { 
            const si = document.getElementById('input-search'); 
            const cb = document.getElementById('btn-clear-search'); 
            if (si.value.trim().length > 0) cb.classList.remove('hidden'); else cb.classList.add('hidden'); 
        }
        
        function clearSearch() { 
            document.getElementById('input-search').value = ""; 
            toggleClearSearchBtn(); 
            executeSearch(); 
            document.getElementById('input-search').focus(); 
        }
        
        function executeSearch() {
            const q = document.getElementById('input-search').value.trim().toLowerCase(); 
            const res = document.getElementById('search-results'); 
            res.innerHTML = "";
            
            if (!q) { 
                res.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Gõ SĐT hoặc từ khóa để tra cứu hồ sơ</div>`; 
                return; 
            }
            
            let sdtSet = new Set();
            dataStore.muaGiay.forEach(m => { if (m.sdt.includes(q) || m.ten.toLowerCase().includes(q) || m.tenGiay.toLowerCase().includes(q)) sdtSet.add(m.sdt); });
            dataStore.giatGiay.forEach(g => { if (g.sdt.includes(q) || g.tenKhachHang.toLowerCase().includes(q)) sdtSet.add(g.sdt); });
            
            if (sdtSet.size === 0) { 
                res.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Không tìm thấy kết quả</div>`; 
                return; 
            }

            sdtSet.forEach(sdt => {
                let cm = dataStore.muaGiay.filter(m => m.sdt === sdt).map(m => ({ type: 'Mua', ...m, dateObj: new Date(m.thoiGian) }));
                let cg = dataStore.giatGiay.filter(g => g.sdt === sdt).map(g => ({ type: 'Giặt', ...g, dateObj: new Date(g.thoiGian) }));
                let name = cm.length > 0 ? cm[0].ten : (cg.length > 0 ? cg[0].tenKhachHang : "Khách");
                let all = [...cm, ...cg].sort((a, b) => b.dateObj - a.dateObj);
                
                res.innerHTML += `
                <div class="bg-white border border-slate-100 rounded-2xl p-4 mb-3 shadow-sm hover:shadow-md transition">
                    <div class="flex items-center justify-between mb-3 pb-3 border-b border-slate-100">
                        <h3 class="text-sm font-black text-slate-900 truncate pr-2">${name}</h3>
                        <div class="flex items-center space-x-1.5 shrink-0">
                            <span class="text-[10px] font-bold text-slate-800 bg-slate-100 px-2 py-1.5 rounded-md border border-slate-200">${sdt}</span>
                            <button onclick="copySdt(event, '${sdt}')" class="p-1.5 bg-cyan-50 hover:bg-cyan-100 text-cyan-600 rounded-md transition" title="Copy SĐT"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                            <a href="tel:${sdt}" class="p-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-md transition" title="Gọi SĐT"><i data-lucide="phone-call" class="w-3.5 h-3.5"></i></a>
                        </div>
                    </div>
                    <div class="space-y-3">
                        ${all.map(t => {
                            let imgUrl = t.type === 'Mua' ? t.urlAnhGiay : t.urlAnhGiayGiat;
                            let imgHtml = imgUrl ? `<div class="relative aspect-[4/3] w-28 shrink-0 rounded-xl overflow-hidden border border-slate-200 cursor-pointer shadow-sm" onclick="openImageZoom('${imgUrl}')"><img src="${imgUrl}" class="w-full h-full object-cover hover:scale-105 transition duration-500"></div>` : '';
                            
                            if(t.type === 'Mua') {
                                return `
                                <div class="flex items-stretch gap-3 bg-slate-50 p-2.5 border border-slate-100 rounded-xl">
                                    ${imgHtml}
                                    <div class="flex-1 flex flex-col justify-center py-1 overflow-hidden">
                                        <div><span class="text-indigo-600 font-extrabold bg-indigo-100 px-1.5 py-0.5 rounded-md text-[9px] uppercase tracking-wider">Mua giày</span></div>
                                        <div class="mt-1 font-bold text-slate-800 text-sm leading-tight truncate">${t.tenGiay}</div>
                                        <div class="font-black text-indigo-600 text-base mt-0.5">${formatMoney(t.gia)}</div>
                                        <div class="text-[10px] text-slate-400 font-medium mt-1">${formatDate(t.thoiGian)}</div>
                                    </div>
                                </div>`;
                            } else {
                                return `
                                <div class="flex items-stretch gap-3 bg-slate-50 p-2.5 border border-slate-100 rounded-xl">
                                    ${imgHtml}
                                    <div class="flex-1 flex flex-col justify-center py-1 overflow-hidden">
                                        <div><span class="text-cyan-600 font-extrabold bg-cyan-100 px-1.5 py-0.5 rounded-md text-[9px] uppercase tracking-wider">Giặt giày</span></div>
                                        <div class="mt-1 font-bold text-slate-800 text-sm leading-tight truncate">${t.dichVu || "Dịch vụ giặt"}</div>
                                        <div class="text-[10px] font-bold text-slate-600 mt-1 bg-white px-2 py-1 rounded-md border border-slate-200 inline-block self-start">TT: ${t.trangThaiThanhToan}</div>
                                        <div class="text-[10px] text-slate-400 font-medium mt-1">${formatDate(t.thoiGian)}</div>
                                    </div>
                                </div>`;
                            }
                        }).join('')}
                    </div>
                </div>`;
            });
            lucide.createIcons();
        }

        function switchTab(tabId) {
            ['mua-giay', 'giat-giay', 'lich-su', 'tra-cuu'].forEach(id => {
                const s = document.getElementById(`section-${id}`);
                const b = document.getElementById(`tab-${id}`);
                if (id === tabId) {
                    s.classList.remove('hidden'); s.classList.add('block');
                    b.className = "flex-1 min-w-[80px] flex flex-col items-center p-2 rounded-xl text-indigo-600 bg-indigo-50 font-bold transition";
                } else {
                    s.classList.add('hidden'); s.classList.remove('block');
                    b.className = "flex-1 min-w-[80px] flex flex-col items-center p-2 rounded-xl text-slate-500 hover:bg-slate-50 transition";
                }
            });
            if (tabId === 'lich-su') renderHistoryList();
        }

        // UTILITIES
        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

        function formatDate(isoString) {
            if (!isoString) return "";
            const d = new Date(isoString);
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')} - ${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}`;
        }

        function previewImage(input, targetId) {
            const target = document.getElementById(targetId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    target.style.backgroundImage = `url(${e.target.result})`;
                    target.classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openImageZoom(src) {
            document.getElementById('lightbox-image').src = src;
            document.getElementById('lightbox-modal').classList.remove('hidden');
            document.getElementById('lightbox-modal').classList.add('flex');
        }

        function closeImageZoom() {
            document.getElementById('lightbox-image').src = "";
            document.getElementById('lightbox-modal').classList.add('hidden');
            document.getElementById('lightbox-modal').classList.remove('flex');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let bg = type === 'danger' ? 'bg-red-500 shadow-red-200' : 'bg-emerald-500 shadow-emerald-200';
            let icon = type === 'danger' ? 'alert-circle' : 'check-circle-2';
            
            toast.className = `${bg} text-white flex items-center space-x-2 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold transform translate-y-2 opacity-0 transition duration-300 pointer-events-auto`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3500); 
        }
    </script>
</body>
</html>
