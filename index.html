<!DOCTYPE html>
<html lang="vi" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiệm Giày Cũ Bình Dương</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .loading-overlay {
            position: fixed; inset: 0; background: rgba(255,255,255,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999;
        }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden text-slate-800 font-sans pb-20">

    <!-- OVERLAY LOADING -->
    <div id="global-loading" class="loading-overlay">
        <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-sm font-bold text-slate-600 animate-pulse">Đang đồng bộ máy chủ...</p>
    </div>

    <!-- TOP HEADER -->
    <header class="bg-indigo-600 text-white p-3 md:p-4 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm shrink-0">
                <i data-lucide="store" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-base md:text-lg font-black tracking-wide leading-tight">Tiệm Giày Cũ Bình Dương</h1>
                <p class="text-[10px] text-indigo-100 font-medium">Hệ thống đơn hàng • <span class="font-bold text-white bg-indigo-500/50 px-1.5 py-0.5 rounded">WIFI: 0378155320</span></p>
            </div>
        </div>
        <button onclick="fetchDataFromBaserow()" class="p-2.5 bg-white/10 hover:bg-white/20 rounded-xl transition shrink-0">
            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- TABS MENU -->
    <nav class="bg-white border-b border-slate-200 px-2 py-2 flex space-x-1 shrink-0 overflow-x-auto no-scrollbar">
        <button onclick="switchTab('tra-cuu')" id="tab-tra-cuu" class="flex-1 min-w-[80px] flex flex-col items-center p-2 rounded-xl text-indigo-600 bg-indigo-50 font-bold transition">
            <i data-lucide="search" class="w-5 h-5 mb-1"></i>
            <span class="text-[10px] uppercase">Tra Cứu</span>
        </button>
        <button onclick="switchTab('mua-giay')" id="tab-mua-giay" class="flex-1 min-w-[80px] flex flex-col items-center p-2 rounded-xl text-slate-500 hover:bg-slate-50 transition">
            <i data-lucide="shopping-bag" class="w-5 h-5 mb-1"></i>
            <span class="text-[10px] uppercase">Mua Giày</span>
        </button>
        <button onclick="switchTab('giat-giay')" id="tab-giat-giay" class="flex-1 min-w-[80px] flex flex-col items-center p-2 rounded-xl text-slate-500 hover:bg-slate-50 transition">
            <i data-lucide="waves" class="w-5 h-5 mb-1"></i>
            <span class="text-[10px] uppercase">Giặt Giày</span>
        </button>
        <button onclick="switchTab('lich-su')" id="tab-lich-su" class="flex-1 min-w-[80px] flex flex-col items-center p-2 rounded-xl text-slate-500 hover:bg-slate-50 transition">
            <i data-lucide="history" class="w-5 h-5 mb-1"></i>
            <span class="text-[10px] uppercase">Lịch Sử</span>
        </button>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 overflow-y-auto bg-slate-50 relative">
        
        <!-- ==================== TRA CỨU ==================== -->
        <section id="section-tra-cuu" class="p-3 md:p-4 space-y-4 max-w-xl mx-auto block animate-in fade-in duration-200">
            <div class="flex items-center space-x-2 text-indigo-600">
                <i data-lucide="search" class="w-5 h-5"></i>
                <h2 class="text-base font-bold text-slate-900">Tra Cứu Nhanh</h2>
            </div>
            
            <div class="relative">
                <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="input-search" oninput="toggleClearSearchBtn()" onkeyup="if(event.key==='Enter') executeSearch()" placeholder="Nhập Số điện thoại hoặc Tên khách..." class="w-full pl-10 pr-10 py-3 bg-white border border-slate-200 rounded-xl text-sm font-semibold shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none transition">
                <button id="btn-clear-search" onclick="clearSearch()" class="absolute right-3 top-3 text-slate-400 hover:text-slate-600 hidden">
                    <i data-lucide="x-circle" class="w-5 h-5"></i>
                </button>
            </div>
            <button onclick="executeSearch()" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold transition flex items-center justify-center space-x-2 shadow-sm">
                <i data-lucide="search" class="w-4 h-4"></i><span>Tìm Kiếm</span>
            </button>
            
            <div id="search-results" class="mt-4 space-y-3 pb-8">
                <div class="text-center py-8 text-slate-400 text-sm">Gõ SĐT hoặc từ khóa để tra cứu hồ sơ</div>
            </div>
        </section>

        <!-- ==================== MUA GIÀY ==================== -->
        <section id="section-mua-giay" class="p-3 md:p-4 max-w-xl mx-auto hidden animate-in fade-in duration-200">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <div class="flex items-center space-x-2">
                        <i data-lucide="shopping-bag" class="w-5 h-5 text-indigo-600"></i>
                        <h2 class="text-base font-bold text-slate-900">Tạo Đơn Bán Giày</h2>
                    </div>
                    <button type="button" onclick="fillAnonymous()" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 text-[10px] font-bold rounded-lg transition flex items-center space-x-1 border border-slate-200">
                        <i data-lucide="user-minus" class="w-3 h-3"></i><span>Khách Ẩn Danh</span>
                    </button>
                </div>

                <form id="form-mua" onsubmit="submitMuaGiay(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3 mb-1">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tên Khách</label>
                            <input type="text" id="mua-ten" required class="w-full px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">SĐT</label>
                            <input type="tel" id="mua-sdt" required class="w-full px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                        </div>
                    </div>

                    <div class="pt-2 border-t border-slate-100">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 flex justify-between items-center">
                            <span>Sản phẩm</span>
                            <button type="button" onclick="addShoeRow()" class="text-indigo-600 hover:text-indigo-800 flex items-center space-x-1 bg-indigo-50 hover:bg-indigo-100 px-2 py-1 rounded-lg transition">
                                <i data-lucide="plus" class="w-3 h-3"></i><span class="text-xs font-bold">Thêm đôi</span>
                            </button>
                        </label>
                        
                        <div id="shoe-container" class="space-y-2.5">
                            <div class="flex space-x-2 shoe-row">
                                <input type="text" value="Giày Sneaker" required class="shoe-name flex-1 px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                                <input type="number" placeholder="Giá..." required onblur="handlePriceBlur(this); calculateTotal()" onkeyup="calculateTotal()" class="shoe-price flex-1 px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm font-black text-indigo-600 focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right">
                            </div>
                        </div>

                        <!-- Vùng hiển thị tự động tổng tiền -->
                        <div id="total-price-display" class="hidden flex justify-between items-center py-2.5 px-4 mt-3 bg-indigo-50 rounded-xl border border-indigo-100">
                            <span class="text-xs font-bold text-indigo-800 uppercase tracking-wider">Tổng cộng:</span>
                            <span id="total-price-value" class="text-lg font-black text-indigo-600">0đ</span>
                        </div>
                    </div>
                    
                    <div class="pt-2">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Thanh Toán</label>
                        <div class="flex space-x-2 bg-slate-100 p-1.5 rounded-xl">
                            <button type="button" id="btn-pay-cash" onclick="selectPayment('Tiền mặt')" class="flex-1 py-2 bg-white shadow-sm text-indigo-600 rounded-lg text-xs font-bold transition">Tiền mặt</button>
                            <button type="button" id="btn-pay-bank" onclick="selectPayment('Chuyển khoản')" class="flex-1 py-2 text-slate-500 rounded-lg text-xs font-bold transition hover:text-slate-700">Chuyển khoản</button>
                        </div>
                    </div>

                    <div class="space-y-3 pt-3">
                        <label class="relative flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-2xl h-36 cursor-pointer bg-slate-50/50 hover:bg-indigo-50 hover:border-indigo-300 transition overflow-hidden group">
                            <input type="file" id="mua-anhgiay" class="absolute inset-0 opacity-0 cursor-pointer z-20" accept="image/*" onchange="previewImage(this, 'mua-preview-giay')">
                            <div class="flex flex-col items-center justify-center space-y-2 pointer-events-none text-slate-400 group-hover:text-indigo-500 transition">
                                <div class="bg-white p-3 rounded-2xl shadow-sm group-hover:scale-110 transition duration-300"><i data-lucide="image-plus" class="w-6 h-6 text-indigo-500"></i></div>
                                <span class="text-xs font-bold">Chạm tải ảnh giày</span>
                            </div>
                            <div id="mua-preview-giay" class="hidden absolute inset-0 z-10 w-full h-full bg-cover bg-center"></div>
                        </label>

                        <label id="wrap-mua-bill" class="hidden relative flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-2xl h-36 cursor-pointer bg-slate-50/50 hover:bg-indigo-50 hover:border-indigo-300 transition overflow-hidden group">
                            <input type="file" id="mua-anhbill" class="absolute inset-0 opacity-0 cursor-pointer z-20" accept="image/*" onchange="previewImage(this, 'mua-preview-bill')">
                            <div class="flex flex-col items-center justify-center space-y-2 pointer-events-none text-slate-400 group-hover:text-indigo-500 transition">
                                <div class="bg-white p-3 rounded-2xl shadow-sm group-hover:scale-110 transition duration-300"><i data-lucide="receipt" class="w-6 h-6 text-indigo-500"></i></div>
                                <span class="text-xs font-bold">Chạm tải Bill CK</span>
                            </div>
                            <div id="mua-preview-bill" class="hidden absolute inset-0 z-10 w-full h-full bg-cover bg-center"></div>
                        </label>
                    </div>

                    <button type="submit" id="btn-submit-mua" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md shadow-indigo-200 flex items-center justify-center space-x-2 transition mt-4">
                        <i data-lucide="check-circle" class="w-5 h-5"></i>
                        <span>Xác Nhận Chốt Đơn</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- ==================== GIẶT GIÀY ==================== -->
        <section id="section-giat-giay" class="p-3 md:p-4 max-w-xl mx-auto hidden animate-in fade-in duration-200">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
                <div class="flex items-center space-x-2 mb-4 pb-3 border-b border-slate-100">
                    <i data-lucide="waves" class="w-5 h-5 text-cyan-600"></i>
                    <h2 class="text-base font-bold text-slate-900">Tạo Đơn Giặt Giày</h2>
                </div>
                <form id="form-giat" onsubmit="submitGiatGiay(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-3 mb-1">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Tên Khách</label>
                            <input type="text" id="giat-ten" required class="w-full px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 focus:bg-white transition">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">SĐT</label>
                            <input type="tel" id="giat-sdt" required class="w-full px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 focus:bg-white transition">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Dịch vụ yêu cầu</label>
                        <input type="text" id="giat-dichvu" value="Giặt + " required class="w-full px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 focus:bg-white transition font-bold text-cyan-700">
                    </div>

                    <label class="relative flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-2xl h-36 cursor-pointer bg-slate-50/50 hover:bg-cyan-50 hover:border-cyan-300 transition overflow-hidden group mt-2">
                        <input type="file" id="giat-anhgiay" class="absolute inset-0 opacity-0 cursor-pointer z-20" accept="image/*" onchange="previewImage(this, 'giat-preview-giay')">
                        <div class="flex flex-col items-center justify-center space-y-2 pointer-events-none text-slate-400 group-hover:text-cyan-500 transition">
                            <div class="bg-white p-3 rounded-2xl shadow-sm group-hover:scale-110 transition duration-300"><i data-lucide="camera" class="w-6 h-6 text-cyan-500"></i></div>
                            <span class="text-xs font-bold">Chạm chụp tình trạng</span>
                        </div>
                        <div id="giat-preview-giay" class="hidden absolute inset-0 z-10 w-full h-full bg-cover bg-center"></div>
                    </label>

                    <div class="pt-2">
                        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Trạng Thái Thanh Toán</label>
                        <select id="giat-thanhtoan" class="w-full px-3 py-3 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-cyan-500 focus:bg-white font-bold text-slate-700 transition">
                            <option value="Chưa thanh toán">Chưa thanh toán</option>
                            <option value="Cọc">Đã cọc</option>
                            <option value="Đã thanh toán">Đã thanh toán</option>
                        </select>
                    </div>

                    <button type="submit" id="btn-submit-giat" class="w-full py-3.5 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl font-bold shadow-md shadow-cyan-200 flex items-center justify-center space-x-2 transition mt-4">
                        <i data-lucide="check-circle" class="w-5 h-5"></i>
                        <span>Nhận Giày Giặt</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- ==================== LỊCH SỬ ==================== -->
        <section id="section-lich-su" class="p-4 space-y-4 max-w-xl mx-auto hidden animate-in fade-in duration-200">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-950 flex flex-col">
                    <span class="flex items-center space-x-2">
                        <i data-lucide="history" class="w-5 h-5 text-indigo-600"></i>
                        <span>Lịch Sử</span>
                    </span>
                    <span class="text-[9px] text-slate-400 font-medium ml-7 uppercase">(Mua: 3 ngày gần nhất | Giặt: Tất cả)</span>
                </h2>
                
                <div class="flex space-x-1 bg-slate-200 p-1 rounded-xl text-xs font-semibold shrink-0">
                    <button id="btn-hist-tat-ca" onclick="filterHistory('tat-ca')" class="px-3 py-1.5 rounded-lg bg-white shadow-sm text-indigo-600 transition">Tất cả</button>
                    <button id="btn-hist-mua" onclick="filterHistory('mua')" class="px-3 py-1.5 rounded-lg text-slate-600 transition">Mua</button>
                    <button id="btn-hist-giat" onclick="filterHistory('giat')" class="px-3 py-1.5 rounded-lg text-slate-600 transition">Giặt</button>
                </div>
            </div>
            
            <div id="history-list" class="space-y-3 pb-8">
                <!-- Nội dung lịch sử -->
            </div>
        </section>
        
    </main>

    <!-- IMAGE LIGHTBOX -->
    <div id="lightbox-modal" class="fixed inset-0 bg-black/95 z-50 items-center justify-center p-4 hidden flex-col" onclick="closeImageZoom()">
        <img id="lightbox-image" src="" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain">
        <button class="absolute top-4 right-4 bg-white/20 text-white p-2.5 rounded-full hover:bg-white/40 transition">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- FIREBASE MODULE -->
    <script type="module">

        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWRBa3-QI8QG6kfP2J_qzgbpDz2_GJPp8",
            authDomain: "doanhthu-73ade.firebaseapp.com",
            projectId: "doanhthu-73ade",
            storageBucket: "doanhthu-73ade.firebasestorage.app",
            messagingSenderId: "449682329782",
            appId: "1:449682329782:web:94974d346a4b49f8651617"
        };

        const app = initializeApp(firebaseConfig);

    <!-- CORE LOGIC JAVASCRIPT -->
    <script>
        const DB_CONFIG = {
            token: 'NiWMS76P9sn2yP76BS53dgiikbc76utz',
            tableMua: '1012082',
            tableGiat: '1012088',
            telegramToken: '8965725827:AAHfHSqjLAmspcMVRayZI8buJVN6MNJMEqs',
            telegramChat: '8511070091'
        };

        let dataStore = { muaGiay: [], giatGiay: [] };
        let currentPaymentMethod = 'Tiền mặt'; 
        let shoeCounter = 1;

        window.onload = function() {
            lucide.createIcons();
            fetchDataFromBaserow();
            switchTab('tra-cuu'); // Tab mặc định là Tra cứu
        };

        // Gửi thông báo Telegram
        async function sendTelegram(text) {
            if(!DB_CONFIG.telegramToken || !DB_CONFIG.telegramChat) return;
            const url = `https://api.telegram.org/bot${DB_CONFIG.telegramToken}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: DB_CONFIG.telegramChat, text: text, parse_mode: 'HTML' })
                });
            } catch (e) { console.error("Lỗi Telegram:", e); }
        }

        function fillAnonymous() {
            document.getElementById('mua-ten').value = "Khách vãng lai";
            document.getElementById('mua-sdt').value = "0000000000";
            showToast("Đã điền thông tin ẩn danh", "success");
        }

        function selectPayment(method) {
            currentPaymentMethod = method;
            const btnCash = document.getElementById('btn-pay-cash');
            const btnBank = document.getElementById('btn-pay-bank');
            const wrapBill = document.getElementById('wrap-mua-bill');

            if (method === 'Tiền mặt') {
                btnCash.className = "flex-1 py-2 bg-white shadow-sm text-indigo-600 rounded-lg text-xs font-bold transition";
                btnBank.className = "flex-1 py-2 text-slate-500 rounded-lg text-xs font-bold transition hover:text-slate-700";
                wrapBill.classList.add('hidden');
                document.getElementById('mua-anhbill').value = ''; 
                document.getElementById('mua-preview-bill').classList.add('hidden');
            } else {
                btnBank.className = "flex-1 py-2 bg-white shadow-sm text-indigo-600 rounded-lg text-xs font-bold transition";
                btnCash.className = "flex-1 py-2 text-slate-500 rounded-lg text-xs font-bold transition hover:text-slate-700";
                wrapBill.classList.remove('hidden');
            }
        }

        function addShoeRow() {
            shoeCounter++;
            const container = document.getElementById('shoe-container');
            const row = document.createElement('div');
            row.className = "flex space-x-2 shoe-row mt-2.5 items-center animate-in fade-in";
            row.innerHTML = `
                <input type="text" value="Giày Sneaker ${shoeCounter}" required class="shoe-name flex-1 px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">
                <input type="number" placeholder="Giá..." required onblur="handlePriceBlur(this); calculateTotal()" onkeyup="calculateTotal()" class="shoe-price flex-1 px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm font-black text-indigo-600 focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right">
                <button type="button" onclick="this.parentElement.remove(); calculateTotal();" class="p-2.5 text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 rounded-xl transition"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
            `;
            container.appendChild(row);
            lucide.createIcons();
            calculateTotal();
        }

        function copySdt(e, sdt) {
            if (e) e.stopPropagation();
            const el = document.createElement('textarea');
            el.value = sdt;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast('Đã copy SĐT: ' + sdt, 'success');
        }

        function handlePriceBlur(input) {
            let val = parseInt(input.value) || 0;
            if (val > 0 && val < 10000) {
                input.value = val * 1000;
            }
        }

        function calculateTotal() {
            let total = 0;
            document.querySelectorAll('.shoe-price').forEach(inp => {
                let v = parseInt(inp.value) || 0;
                if(v > 0 && v < 10000) v *= 1000; // Tạm tính ngầm cho phần hiển thị
                total += v;
            });
            const display = document.getElementById('total-price-display');
            const val = document.getElementById('total-price-value');
            if (total > 0) {
                display.classList.remove('hidden');
                val.innerText = formatMoney(total);
            } else {
                display.classList.add('hidden');
            }
        }

        async function fetchAllPages(url) {
            let results = []; 
            let nextUrl = url;
            while(nextUrl) {
                if (nextUrl.startsWith('http://')) {
                    nextUrl = nextUrl.replace('http://', 'https://');
                }
                const res = await fetch(nextUrl, { headers: { "Authorization": `Token ${DB_CONFIG.token}` } });
                if (!res.ok) throw new Error("Lỗi fetch dữ liệu Baserow");
                const data = await res.json();
                results = results.concat(data.results);
                nextUrl = data.next;
            }
            return results;
        }

        // TỰ ĐỘNG XÓA ĐƠN MUA CŨ SAU 3 NGÀY
        async function fetchDataFromBaserow() {
            document.getElementById('global-loading').style.display = 'flex';
            try {
                const giatRes = await fetchAllPages(`https://api.baserow.io/api/database/rows/table/${DB_CONFIG.tableGiat}/?user_field_names=true`);
                const muaRes = await fetchAllPages(`https://api.baserow.io/api/database/rows/table/${DB_CONFIG.tableMua}/?user_field_names=true`);

                const now = new Date();
                const threeDaysAgo = new Date(now.getTime() - (3 * 24 * 60 * 60 * 1000));
                
                let activeMua = [];
                for (let row of muaRes) {
                    const rowDate = new Date(row["Thời gian"]);
                    if (rowDate < threeDaysAgo) {
                        fetch(`https://api.baserow.io/api/database/rows/table/${DB_CONFIG.tableMua}/${row.id}/`, {
                            method: "DELETE",
                            headers: { "Authorization": `Token ${DB_CONFIG.token}` }
                        }).catch(e => console.log("Lỗi xóa ngầm:", e));
                    } else {
                        activeMua.push(row);
                    }
                }

                dataStore.giatGiay = giatRes.map(row => ({
                    id: row.id,
                    tenKhachHang: row["Tên khách hàng"] || "",
                    sdt: row["Số điện thoại"] || "",
                    dichVu: row["Dịch vụ"] || "",
                    trangThaiThanhToan: row["Trạng thái thanh toán"]?.value || row["Trạng thái thanh toán"] || "Chưa thanh toán",
                    trangThaiXuLy: row["Trạng thái xử lý"]?.value || row["Trạng thái xử lý"] || "Đang xử lý",
                    thoiGian: row["Thời gian"],
                    urlAnhGiayGiat: row["Link ảnh giày giặt"]?.[0]?.url || ""
                }));

                dataStore.muaGiay = activeMua.map(row => ({
                    id: row.id,
                    ten: row["Tên khách"] || "",
                    sdt: row["Số điện thoại"] || "",
                    tenGiay: row["Tên giày"] || "",
                    gia: Number(row["Giá bán"]) || 0,
                    hinhThuc: row["Hình thức"]?.value || row["Hình thức"] || "Tiền mặt",
                    thoiGian: row["Thời gian"],
                    urlAnhGiay: row["Link ảnh giày"]?.[0]?.url || "",
                    urlAnhBill: row["Link ảnh Bill"]?.[0]?.url || ""
                }));

                renderHistoryList();
                if(document.getElementById('input-search').value.trim() !== "") executeSearch();
                showToast("Đồng bộ máy chủ thành công!", "success");
            } catch (err) {
                console.error(err);
                showToast("Lỗi kết nối máy chủ", "danger");
            } finally {
                document.getElementById('global-loading').style.display = 'none';
            }
        }

                    const tokenBill = await uploadFileToBaseRow(fileBill);
                    if (tokenBill) payload["Link ảnh Bill"] = [{"name": tokenBill}];
                }

                // Gửi Telegram

                document.getElementById('mua-preview-bill').style.backgroundImage = "";

                shoeCounter = 1;

                        <input type="text" value="Giày Sneaker" required class="shoe-name flex-1 px-3 py-2.5 bg-slate-50/50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white transition">

                showToast("Lỗi: " + err.message, "danger");

                lucide.createIcons();

        async function uploadFileToBaseRow(file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('https://api.baserow.io/api/user-files/upload-file/', {
                    method: 'POST',
                    headers: { 'Authorization': `Token ${DB_CONFIG.token}` },
                    body: formData
                });
                if (!res.ok) throw new Error("Upload ảnh thất bại");
                const data = await res.json();
                return data.name;
            } catch (err) {
                console.error(err);
                return null;
            }
        }

            renderHistoryList();
        }

            const listContainer = document.getElementById('history-list'); listContainer.innerHTML = ""; let list = [];
            if (currentHistFilter === 'tat-ca' || currentHistFilter === 'mua') { dataStore.muaGiay.forEach(m => list.push({ ...m, filterType: 'mua', sortDate: new Date(m.thoiGian) })); }
            if (currentHistFilter === 'tat-ca' || currentHistFilter === 'giat') { dataStore.giatGiay.forEach(g => list.push({ ...g, filterType: 'giat', sortDate: new Date(g.thoiGian) })); }

        function toggleClearSearchBtn() { const si = document.getElementById('input-search'); const cb = document.getElementById('btn-clear-search'); if (si.value.trim().length > 0) cb.classList.remove('hidden'); else cb.classList.add('hidden'); }
        function clearSearch() { document.getElementById('input-search').value = ""; toggleClearSearchBtn(); executeSearch(); document.getElementById('input-search').focus(); }
        
        function executeSearch() {
            const q = document.getElementById('input-search').value.trim().toLowerCase(); const res = document.getElementById('search-results'); res.innerHTML = "";
            if (!q) { res.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Gõ SĐT hoặc từ khóa để tra cứu hồ sơ</div>`; return; }
            let sdtSet = new Set();
            dataStore.muaGiay.forEach(m => { if (m.sdt.includes(q) || m.ten.toLowerCase().includes(q) || m.tenGiay.toLowerCase().includes(q)) sdtSet.add(m.sdt); });
            dataStore.giatGiay.forEach(g => { if (g.sdt.includes(q) || g.tenKhachHang.toLowerCase().includes(q)) sdtSet.add(g.sdt); });
            if (sdtSet.size === 0) { res.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Không tìm thấy kết quả</div>`; return; }

            sdtSet.forEach(sdt => {
                let cm = dataStore.muaGiay.filter(m => m.sdt === sdt).map(m => ({ type: 'Mua', ...m, dateObj: new Date(m.thoiGian) }));
                let cg = dataStore.giatGiay.filter(g => g.sdt === sdt).map(g => ({ type: 'Giặt', ...g, dateObj: new Date(g.thoiGian) }));
                let name = cm.length > 0 ? cm[0].ten : (cg.length > 0 ? cg[0].tenKhachHang : "Khách");
                let all = [...cm, ...cg].sort((a, b) => b.dateObj - a.dateObj);
                
                res.innerHTML += `
                <div class="bg-white border border-slate-100 rounded-2xl p-4 mb-3 shadow-sm">
                    <div class="flex items-center justify-between mb-3 pb-3 border-b border-slate-100">
                        <h3 class="text-sm font-black text-slate-900 truncate pr-2">${name}</h3>
                        <div class="flex items-center space-x-1.5 shrink-0">
                            <span class="text-xs font-bold text-slate-800 bg-slate-100 px-2 py-1 rounded-md border border-slate-200">${sdt}</span>
                            <button onclick="copySdt(event, '${sdt}')" class="p-1 bg-cyan-50 hover:bg-cyan-100 text-cyan-600 rounded-md transition" title="Copy SĐT"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                            <a href="tel:${sdt}" class="p-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-md transition" title="Gọi SĐT"><i data-lucide="phone-call" class="w-3.5 h-3.5"></i></a>
                        </div>
                    </div>
                    <div class="space-y-3">
                        ${all.map(t => {
                            let imgUrl = t.type === 'Mua' ? t.urlAnhGiay : t.urlAnhGiayGiat;
                            let imgHtml = imgUrl ? `<div class="relative aspect-[4/3] w-28 shrink-0 rounded-xl overflow-hidden border border-slate-200 cursor-pointer" onclick="openImageZoom('${imgUrl}')"><img src="${imgUrl}" class="w-full h-full object-cover hover:scale-105 transition"></div>` : '';
                            
                            if(t.type === 'Mua') {
                                return `
                                <div class="flex items-stretch gap-3 bg-slate-50 p-2 border border-slate-200 rounded-xl">
                                    ${imgHtml}
                                    <div class="flex-1 flex flex-col justify-center py-1 overflow-hidden">
                                        <div><span class="text-indigo-600 font-extrabold bg-indigo-100 px-1.5 py-0.5 rounded-md text-[9px] uppercase tracking-wider">Mua giày</span></div>
                                        <div class="mt-1 font-bold text-slate-800 text-sm leading-tight truncate">${t.tenGiay}</div>
                                        <div class="font-black text-indigo-600 text-base mt-0.5">${formatMoney(t.gia)}</div>
                                        <div class="text-[10px] text-slate-400 mt-1">${formatDate(t.thoiGian)}</div>
                                    </div>
                                </div>`;
                            } else {
                                return `
                                <div class="flex items-stretch gap-3 bg-slate-50 p-2 border border-slate-200 rounded-xl">
                                    ${imgHtml}
                                    <div class="flex-1 flex flex-col justify-center py-1 overflow-hidden">
                                        <div><span class="text-cyan-600 font-extrabold bg-cyan-100 px-1.5 py-0.5 rounded-md text-[9px] uppercase tracking-wider">Giặt giày</span></div>
                                        <div class="mt-1 font-bold text-slate-800 text-sm leading-tight truncate">${t.dichVu || "Dịch vụ giặt"}</div>
                                        <div class="text-xs font-bold text-slate-600 mt-0.5">TT: ${t.trangThaiThanhToan}</div>
                                        <div class="text-[10px] text-slate-400 mt-1">${formatDate(t.thoiGian)}</div>
                                    </div>
                                </div>`;
                            }
                        }).join('')}
                    </div>
                </div>`;
            });
            lucide.createIcons();
        }

        function switchTab(tabId) {
            ['tra-cuu', 'mua-giay', 'giat-giay', 'lich-su'].forEach(id => {
                const s = document.getElementById(`section-${id}`);
                const b = document.getElementById(`tab-${id}`);
                if (id === tabId) {
                    s.classList.remove('hidden'); s.classList.add('block');
                    b.className = "flex-1 min-w-[80px] flex flex-col items-center p-2 rounded-xl text-indigo-600 bg-indigo-50 font-bold transition";
                } else {
                    s.classList.add('hidden'); s.classList.remove('block');
                    b.className = "flex-1 min-w-[80px] flex flex-col items-center p-2 rounded-xl text-slate-500 hover:bg-slate-50 transition";
                }
            });
            if (tabId === 'lich-su') renderHistoryList();
        }

        function formatMoney(amount) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount); }
        function formatDate(isoString) {
            if (!isoString) return ""; const d = new Date(isoString);
            return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')} - ${d.getDate().toString().padStart(2, '0')}/${(d.getMonth() + 1).toString().padStart(2, '0')}`;
        }

        function previewImage(input, targetId) {
            const target = document.getElementById(targetId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { target.style.backgroundImage = `url(${e.target.result})`; target.classList.remove('hidden'); }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openImageZoom(src) { document.getElementById('lightbox-image').src = src; document.getElementById('lightbox-modal').classList.remove('hidden'); document.getElementById('lightbox-modal').classList.add('flex'); }
        function closeImageZoom() { document.getElementById('lightbox-image').src = ""; document.getElementById('lightbox-modal').classList.add('hidden'); document.getElementById('lightbox-modal').classList.remove('flex'); }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container'); const toast = document.createElement('div');
            let bg = type === 'danger' ? 'bg-red-500 shadow-red-200' : (type === 'warning' ? 'bg-amber-500 shadow-amber-200' : 'bg-emerald-500 shadow-emerald-200');
            let icon = type === 'danger' ? 'alert-circle' : (type === 'warning' ? 'info' : 'check-circle-2');
            toast.className = `${bg} text-white flex items-center space-x-2 px-4 py-3 rounded-xl shadow-lg text-xs font-semibold transform translate-y-2 opacity-0 transition duration-300 pointer-events-auto`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast); lucide.createIcons();
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => { toast.classList.add('translate-y-2', 'opacity-0'); setTimeout(() => { toast.remove(); }, 300); }, 2500);
